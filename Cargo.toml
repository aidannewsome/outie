[package]
name = "outie"
version = "0.2.0"
edition = "2024"
description = "Turn every face of a triangle mesh to face out, even when the mesh is not closed: the ray casting method of Takayama et al. 2014, libigl's reorient_facets_raycast, in Rust with Embree."
license = "MPL-2.0"
repository = "https://github.com/aidannewsome/outie"
exclude = ["data", "docs", "figures", "results", "scripts"]  # the figures' work, kept from the sdist

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
rand = "0.10.3"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
