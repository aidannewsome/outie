[package]
name = "outie"
version = "0.1.10"
edition = "2024"
description = "Turn every face of a triangle mesh to face out, even when the mesh is not closed: libigl's reorient_facets_raycast in Rust."
license = "MPL-2.0"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
earcut = "0.4.11"
numpy = "0.29.0"
parry3d-f64 = "0.31.1"
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }
rand = "0.10.3"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
