# On a version tag: a wheel for each system built from the Rust core, tested where it can run, and published to PyPI
# by trusted publishing, no token stored anywhere. One wheel a system serves every Python from 3.12, through the stable ABI;
# a second serves free-threaded Python 3.14, which the stable ABI does not reach.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64, test: true }
          - { runner: ubuntu-22.04-arm, target: aarch64, test: true }
          - { runner: macos-latest, target: aarch64, test: true }
          - { runner: macos-15-intel, target: x86_64, test: true }
          - { runner: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14t
            3.12
      - name: The tag must be the version in pyproject.toml and Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" && test "$version" = "$crate" || { echo "tag ${GITHUB_REF_NAME}, pyproject $version, Cargo $crate"; exit 1; }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.14t
          manylinux: auto
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --find-links dist outie pytest
          python -m pytest -q tests
          python3.14t -m pip install --find-links dist outie pytest
          python3.14t -m pytest -q tests
          python3.14t -c "import sys, outie; assert not sys._is_gil_enabled(), 'outie turned the lock back on'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
