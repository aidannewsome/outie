# On every push and pull request: the pre-commit checks, ruff, rustfmt and clippy, as anyone's commit must pass them;
# then built from source on Linux, with Embree built as the wheels carry it, and tested with the oldest and newest
# Python and free-threaded Python, which must keep its lock off. Every system is tested when a release is built.
name: Test

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --only-dev pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: embree
          key: embree-ubuntu-latest-${{ hashFiles('.github/build-embree.sh') }}
      - run: bash .github/build-embree.sh
      - run: uv sync
      - run: uv run pytest -q
      - name: Free-threaded Python keeps its lock off
        if: matrix.python == '3.14t'
        run: uv run python -c "import sys, outie; assert not sys._is_gil_enabled(), 'outie turned the lock back on'"
