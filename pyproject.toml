[project]
name = "outie"
version = "0.1.4"
description = "Turn every face of a mesh to face out, like an outie, even when the mesh is not closed. A port of libigl's reorient_facets_raycast."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aidan Newsome", email = "aidan.newsome@me.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "trimesh>=4.0",
    "embreex>=4.0",
]

[project.urls]
Source = "https://github.com/aidannewsome/outie"
Releases = "https://github.com/aidannewsome/outie/releases"
Paper = "https://jcgt.org/published/0003/04/02/paper.pdf"
Reference = "https://github.com/libigl/libigl/blob/main/include/igl/embree/reorient_facets_raycast.cpp"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outie"]
