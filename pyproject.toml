[project]
name = "outie"
version = "0.1.11"
description = "Turn every face of a polygon mesh to face out, like an outie, even when the mesh is not closed. libigl's reorient_facets_raycast, in Rust."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aidan Newsome", email = "aidan.newsome@me.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Source = "https://github.com/aidannewsome/outie"
Releases = "https://github.com/aidannewsome/outie/releases"
Paper = "https://jcgt.org/published/0003/04/02/paper.pdf"
Reference = "https://github.com/libigl/libigl/blob/main/include/igl/embree/reorient_facets_raycast.cpp"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "outie._core"
features = ["pyo3/extension-module"]
